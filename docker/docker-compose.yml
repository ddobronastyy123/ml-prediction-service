
version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ml-app:v1
    container_name: ml-app
    ports:
      - "5000:5000"
    environment:
      DB_HOST: "10.0.2.4"
      DB_NAME: "ml_predictions"
      DB_USER: "ml_app"
      DB_PASSWORD: "StrongPassword"
      DB_SSLMODE: "require"
      MODEL_PATH: "/model/model.pkl"
    restart: unless-stopped
